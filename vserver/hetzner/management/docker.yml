          #{% endif %}

  roles:
    - role: docker-stop
      tags: stop
      include_tasks: stop.yml
    - role: docker-start
      tags: start
      include_tasks: start.yml
    - role: docker-restart
      tags: restart
      include_tasks: restart.yml

