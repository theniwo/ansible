---
- name: Manage Docker containers
  hosts: docker_server
  become: true
  become_user: root
  environment:
    LC_ALL: C
    LANG: C
  pre_tasks:
    - name: "Set Variables for docker"
      tags:
        - start
        - stop
        - restart
      ansible.builtin.include_vars:
        file: docker.yml

    - name: Check if tags are specified
      assert:
        that:
          - (ansible_playbook_tags is defined) and (ansible_playbook_tags | length > 0)
        fail_msg: "Please specify at least one tag of 'start, stop or restart' for the playbook."
        success_msg: "Tag is set."
