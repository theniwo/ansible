---
# PKGS
- name: Install requirements ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - packages
    - pkgs
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - "{{ pkgs_distro }}"
  vars:
    pkgs_distro: "{{ pkgs_deb if ansible_facts['os_family'] in 'Debian' else pkgs_rpm if ansible_facts['os_family'] in 'RedHat' }}"
    sqlite_name: "{{ 'sqlite3' if ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] >= '24' else 'sqlite' if ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] < '24' else 'sqlite' }}"
    locate_name: "{{ 'plocate' if ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] >= '22' else 'locate' if ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] < '22' else 'locate' }}"
  when: ansible_facts['os_family'] in ['Debian', 'RedHat']

# SYS
# Fail2ban
- name: Start and enable Fail2Ban service
  tags:
    - fail2ban
    - sys
  systemd:
    name: fail2ban
    state: started
    enabled: true

- name: Ensure firewalld is installed (optional for Fail2Ban IP banning) ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - fail2ban
    - sys
  dnf:
    name: firewalld
    state: present
  when: ansible_facts['os_family'] in ['RedHat']

- name: Start and enable firewalld service ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - fail2ban
    - sys
  systemd:
    name: firewalld
    state: started
    enabled: true
  when: ansible_facts['os_family'] in ['RedHat']

- name: Restart Fail2Ban to apply new configuration
  tags:
    - fail2ban
    - sys
  systemd:
    name: fail2ban
    state: restarted

# Sysctl
- name: Disable IPv6
  tags:
    - ipv6
    - sysctl
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.disable_ipv6
    value: '1'
    sysctl_set: true
    reload: yes

- name: Disable IPv6
  tags:
    - ipv6
    - sysctl
  ansible.posix.sysctl:
    name: net.ipv6.conf.default.disable_ipv6
    value: '1'
    sysctl_set: true
    reload: yes

# CFG
# Aliases
- name: Creating /root/.bash_aliases ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - aliases
    - cfg
  file:
    path: "/root/.bash_aliases"
    state: touch
  when: ansible_facts['os_family'] in ['Debian']

- name: bash_aliases
  tags:
    - aliases
    - cfg
  copy:
    dest: /root/.bash_aliases
    content: |
      alias bashrc='source ~/.bashrc'
  when: ansible_facts['os_family'] in ['Debian']

- name: Add crontab function to .bash_aliases ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - aliases
    - cfg
  blockinfile:
    path: /root/.bash_aliases
    block: |
      crontab ()
      {
          if [[ $* == '-r'*(^i) ]]; then
              echo "Not allowed! Use 'crontab -ir' or '-ri' instead!";
          else
              /usr/bin/crontab $*;
          fi
      }
    marker: "# {mark} Ansible managed crontab function"
    state: present
  when: ansible_facts['os_family'] in ['Debian']

- name: Alias df ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - aliases
    - cfg
  ansible.builtin.lineinfile:
    path: /root/.bash_aliases
    regexp: '^alias df'
    line: "alias df='df --exclude-type=tmpfs --exclude-type=loop --exclude-type=squashfs --exclude-type=overlay'"
  when: ansible_facts['os_family'] in ['Debian']

- name: Add crontab function to .bashrc ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - aliases
    - cfg
  blockinfile:
    path: /root/.bashrc
    block: |
      crontab ()
      {
          if [[ $* == '-r'*(^i) ]]; then
              echo "Not allowed! Use 'crontab -ir' or '-ri' instead!";
          else
              /usr/bin/crontab $*;
          fi
      }
    marker: "# {mark} Ansible managed crontab function"
    state: present
  when: ansible_facts['os_family'] in ['RedHat']

- name: Alias bashrc ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - aliases
    - cfg
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    regexp: '^alias bashrc'
    line: "alias bashrc='source ~/.bashrc'"
  when: ansible_facts['os_family'] in ['RedHat']

- name: Alias df ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - aliases
    - cfg
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    regexp: '^alias df'
    line: "alias df='df --exclude-type=tmpfs --exclude-type=loop --exclude-type=squashfs --exclude-type=overlay'"
  when: ansible_facts['os_family'] in ['RedHat']

# Tmux
- name: Get user info for the effective target user ({{ target_username }})
  tags:
    - byobu
    - tmux
  ansible.builtin.user:
    name: "{{ target_username }}"
  register: effective_target_user_info
  become: no # This task does not require root privileges to read user info
  #failed_when: not effective_target_user_info.exists # Fail if the user doesn't exist

- name: Ensure TPM directory exists
  tags:
    - byobu
    - tmux
  ansible.builtin.file:
    path: "{{ effective_target_user_info.home }}/.tmux/plugins"
    state: directory
    mode: '0755'
    # Use the UID/GID obtained from effective_target_user_info.
    # If for some reason uid/gid are missing (unlikely but possible),
    # using the user name directly is a robust fallback for 'owner' and 'group'.
    owner: "{{ effective_target_user_info.uid | default(target_username) }}"
    group: "{{ effective_target_user_info.gid | default(target_username) }}"
  become: yes # Must be executed as root to set ownership correctly

- name: "DEB: Ensure byobu, tmux, git, and tmux-plugin-manager are installed on Debian based systems ({{ ansible_distribution }} {{ ansible_distribution_version }})"
  tags:
    - byobu
    - tmux
  ansible.builtin.apt:
    name:
      - byobu
      - tmux
      - git
      - tmux-plugin-manager
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] in ['Debian']

# RHEL
- name: "RHEL: Ensure byobu, tmux and git are installed on RHEL based systems ({{ ansible_distribution }} {{ ansible_distribution_version }})"
  tags:
    - byobu
    - tmux
  ansible.builtin.dnf: # or 'dnf' for newer RHEL/CentOS/Rocky
    name:
      - tmux
      - git
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] in ['RedHat']


- name: "RHEL: Clone tmux-plugin-manager if it does not exist ({{ ansible_distribution }} {{ ansible_distribution_version }})"
  tags:
    - byobu
    - tmux
  ansible.builtin.git:
    repo: 'https://github.com/tmux-plugins/tpm'
    dest: "{{ effective_target_user_info.home }}/.tmux/plugins/tpm"
    version: master # Or a specific tag/commit if preferred
    update: no # Only clone if it doesn't exist, don't update on every run
  become_user: "{{ target_username }}" # Clone as the target user
  when: ansible_facts['os_family'] in ['RedHat']

- name: Byobu/Tmux config
  tags:
    - byobu
    - tmux
  ansible.builtin.lineinfile:
    path: /root/.config/byobu/.tmux.conf
    regexp: '^bind r source-file ~/.config/byobu/.tmux.conf \; display "Config Reloaded!" '
    line: 'bind r source-file ~/.config/byobu/.tmux.conf \; display "Config Reloaded!" '

- name: "DEB: Configure Byobu/tmux with TPM plugins for the user ({{ ansible_distribution }} {{ ansible_distribution_version }})"
  tags:
    - byobu
    - tmux
  ansible.builtin.blockinfile:
    path: "{{ effective_target_user_info.home }}/.config/byobu/.tmux.conf"
    create: yes
    # Use the UID/GID obtained from effective_target_user_info.
    # If for some reason uid/gid are missing (unlikely but possible),
    # using the user name directly is a robust fallback for 'owner' and 'group'.
    owner: "{{ effective_target_user_info.uid | default(target_username) }}"
    group: "{{ effective_target_user_info.gid | default(target_username) }}"
    mode: '0644' 
    block: |
      # List of plugins managed by TPM (see defaults/main.yml for list)
      {% for plugin in plugin_list %}
      set -g @plugin '{{ plugin }}'
      {% endfor %}
      # Specific plugin configurations
      set -g @continuum-restore 'on' # Automatic restore of sessions on tmux start
      # Keep this line at the very bottom of tmux.conf
      run-shell '/usr/share/tmux-plugin-manager/tpm'
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR TMUX PLUGINS"
    insertafter: EOF # Ensures the block is added at the end of the file
  become: yes # Must be executed as root to set ownership correctly
  when: ansible_facts['os_family'] in ['Debian']

- name: "RHEL: Configure Byobu/tmux with TPM plugins for the user ({{ ansible_distribution }} {{ ansible_distribution_version }})"
  tags:
    - byobu
    - tmux
  ansible.builtin.blockinfile:
    path: "{{ effective_target_user_info.home }}/.config/byobu/.tmux.conf"
    create: yes
    # Use the UID/GID obtained from effective_target_user_info.
    # If for some reason uid/gid are missing (unlikely but possible),
    # using the user name directly is a robust fallback for 'owner' and 'group'.
    owner: "{{ effective_target_user_info.uid | default(target_username) }}"
    group: "{{ effective_target_user_info.gid | default(target_username) }}"
    mode: '0644' 
    block: |
      # List of plugins managed by TPM (see defaults/main.yml for list)
      {% for plugin in plugin_list %}
      set -g @plugin '{{ plugin }}'
      {% endfor %}
      # Specific plugin configurations
      set -g @continuum-restore 'on' # Automatic restore of sessions on tmux start
      # Keep this line at the very bottom of tmux.conf
      run-shell '~/.tmux/plugins/tpm/tpm'
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR TMUX PLUGINS"
    insertafter: EOF # Ensures the block is added at the end of the file
  become: yes # Must be executed as root to set ownership correctly
  when: ansible_facts['os_family'] in ['RedHat']

- name: "RHEL: Run TPM to install plugins ({{ ansible_distribution }} {{ ansible_distribution_version }})"
  tags:
    - byobu
    - tmux
  ansible.builtin.command: "{{ effective_target_user_info.home }}/.tmux/plugins/tpm/tpm"
  args:
    chdir: "{{ effective_target_user_info.home }}" # Ensure command runs from user's home directory
  become_user: "{{ target_username }}" # Run as the current user, not root
  register: tpm_install_output
  changed_when: "'Successfully installed' in tpm_install_output.stdout or 'cloned' in tpm_install_output.stdout"
  # Note: For this task to automatically trigger plugin installation, the user
  # needs to start a new Byobu/tmux session, or the tmux.conf needs to be
  # explicitly sourced (e.g., 'tmux source-file ~/.config/byobu/.tmux.conf').
  # The 'run-shell' line in the config handles this on the first session start.
  when: ansible_facts['os_family'] in ['RedHat']

# Env

- name: HISTCONTROL ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - cfg
    - env
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    regexp: '^HISTCONTROL='
    line: 'HISTCONTROL='
  #when: ansible_facts['os_family'] in ['Debian']

- name: HISTSIZE ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - cfg
    - env
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    regexp: '^HISTSIZE='
    line: 'HISTSIZE=9999999999'
  #when: ansible_facts['os_family'] in ['Debian']

- name: HISTFILESIZE ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - cfg
    - env
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    regexp: '^HISTFILESIZE='
    line: 'HISTFILESIZE=9999999999'
  #when: ansible_facts['os_family'] in ['Debian']

- name: HISTTIMEFORMAT ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - cfg
    - env
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    regexp: '^HISTTIMEFORMAT="%F %T "'
    line: 'HISTTIMEFORMAT="%F %T "'
  #when: ansible_facts['os_family'] in ['Debian']

- name: VISUAL vim ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - cfg
    - env
    - vim
  ansible.builtin.lineinfile:
    path: /root/.bash_aliases
    regexp: '^export VISUAL=vim'
    line: 'export VISUAL=vim'
  when: ansible_facts['os_family'] in ['Debian']

- name: VISUAL vim ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - cfg
    - env
    - vim
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    regexp: '^export VISUAL=vim'
    line: 'export VISUAL=vim'
  when: ansible_facts['os_family'] in ['RedHat']

- name: EDITOR vim ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - cfg
    - env
    - vim
  ansible.builtin.lineinfile:
    path: /root/.bash_aliases
    regexp: '^export EDITOR="$VISUAL"'
    line: 'export EDITOR="$VISUAL"'
  when: ansible_facts['os_family'] in ['Debian']

- name: EDITOR vim ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - cfg
    - env
    - vim
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    regexp: '^export EDITOR="$VISUAL"'
    line: 'export EDITOR="$VISUAL"'
  when: ansible_facts['os_family'] in ['RedHat']

# Vim
- name: Create /etc/vim directory if it does not exist
  tags:
    - cfg
    - vim
  ansible.builtin.file:
    path: /etc/vim
    state: directory
    mode: '0755'

- name: Creating vimrc.local
  tags:
    - cfg
    - vim
  file:
    path: "/etc/vim/vimrc.local"
    state: touch

- name: Update alternative editor to vim ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - cfg
    - vim
  community.general.alternatives:
    name: editor
    path: /usr/bin/vim
  when: ansible_facts['os_family'] in ['Debian']

- name: Update alternative editor to vim ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - cfg
    - vim
  ansible.builtin.file:
    src: /usr/bin/vim
    dest: /usr/bin/editor
    state: link
  when: ansible_facts['os_family'] in ['RedHat']

# Nobell
- name: Nobell for vim
  tags:
    - cfg
    - nobell
    - vim
  copy:
    dest: /etc/vim/vimrc.local
    content: |
      set mouse-=a
      syntax on
      set visualbell
      set t_vb=

- name: Nobell for bash
  tags:
    - cfg
    - nobell
  ansible.builtin.lineinfile:
    path: /etc/inputrc
    regexp: '^#set bell-style none'
    line: set bell-style none

- name: Creating less.sh
  tags:
    - cfg
    - nobell
  file:
    path: "/etc/profile.d/less.sh"
    state: touch

- name: Nobell for less
  tags:
    - cfg
    - nobell
  copy:
    dest: /etc/profile.d/less.sh
    content: |
      export LESS="$LESS -Q"

# Finishing up
