---
- name: Install requirements ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - tty
  ansible.builtin.package:
    name: locales
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] in ['Debian']

- name: Install requirements ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - tty
  ansible.builtin.package:
    name:
      - glibc-common
      - glibc-langpack-de
      - glibc-langpack-en
      - glibc-locale-source
    state: present
  when: ansible_facts['os_family'] in ['RedHat']

