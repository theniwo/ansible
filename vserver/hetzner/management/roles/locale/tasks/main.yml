- name: Set default locale to German ({{ ansible_distribution }} {{ ansible_distribution_version }})
  ansible.builtin.lineinfile:
    path: "{{ locale_name }}"
    regexp: '^LANG=.*'
    line: 'LANG=de_DE.UTF-8'
    state: present
  vars:
    locale_name: "{{ '/etc/default/locale' if ansible_facts['os_family'] == 'Debian' else '/etc/locale.conf' if ansible_facts['os_family'] == 'RedHat' }}"
  when: ansible_facts['os_family'] in ['Debian', 'RedHat']

- name: Set locale environment for user ({{ ansible_distribution }} {{ ansible_distribution_version }})
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^LANG=.*'
    line: 'LANG=de_DE.UTF-8'
    state: present

- name: Set keyboard layout to German ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - tty
  ansible.builtin.command:
    cmd: localectl set-keymap de
  when: ansible_facts['os_family'] in ['RedHat']

- name: Set keyboard layout to German ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - tty
  ansible.builtin.lineinfile:
    path: /etc/default/keyboard
    regexp: '^XKBLAYOUT=.*'
    line: 'XKBLAYOUT=de'
    state: present
  when: ansible_facts['os_family'] in ['Debian']

- name: Apply keyboard layout ({{ ansible_distribution }} {{ ansible_distribution_version }})
  tags:
    - tty
  ansible.builtin.shell:
    cmd: setupcon 2>/dev/null
  when: ansible_facts['os_family'] in ['Debian']

- name: Apply changes ({{ ansible_distribution }} {{ ansible_distribution_version }})
  ansible.builtin.shell: . {{ locale_name }}
  vars:
    locale_name: "{{ '/etc/default/locale' if ansible_facts['os_family'] == 'Debian' else '/etc/locale.conf' if ansible_facts['os_family'] == 'RedHat' }}"
  when: ansible_facts['os_family'] in ['Debian', 'RedHat']


