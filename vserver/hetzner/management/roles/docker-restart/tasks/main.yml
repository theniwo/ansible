  #ansible.builtin.debug:
    #var: docker_containers_raw
#
#- name: Convert container list to array by names
  #ansible.builtin.set_fact:
    #docker_containers_array: "{{ docker_containers_raw.stdout_lines }}"
    #
#- name: Extract Container names for docker by name
  #ansible.builtin.set_fact:
    #docker_docker_containers: "{{ docker_containers_array | reject('search', '-1') | list }}"
#
#- name: Extract Container names for docker-compose by name
  #ansible.builtin.set_fact:
    #docker_compose_containers: "{{ docker_containers_array | select('search', '-1') | list }}"

- name: Show extracted Docker containers (optional)
  ansible.builtin.debug:
    var: docker_docker_containers

- name: Show extracted Docker-Compose containers (optional)
  ansible.builtin.debug:
    var: docker_compose_containers

- name: Stop and remove multiple Docker containers
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
  loop: "{{ docker_docker_containers }}"
  register: docker_results

- name: Stop and remove multiple Docker Compose stacks
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_path }}/{{ item }}"
    state: absent
  loop: "{{ docker_compose_containers }}"
  register: compose_results

