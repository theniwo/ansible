  #community.docker.docker_container:
    #name: "{{ item }}"
    #state: present
  #loop: "{{ docker_docker_containers }}"
  #register: docker_results

- name: Start Docker containers
  ansible.builtin.shell: "{{ docker_dir }}/{{ item }}"
  loop: "{{ docker_docker_containers }}"
  register: docker_results

- name: Start Docker Compose stacks
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_path }}/{{ item }}"
    state: present
  loop: "{{ docker_compose_containers }}"
  register: compose_results

