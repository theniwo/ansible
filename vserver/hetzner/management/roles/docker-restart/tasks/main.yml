---
# tasks file for docker-restart
- name: Get all Docker volumes using CLI
  ansible.builtin.command:
    cmd: docker volume ls --format '{{ "{{" }}.Driver{{ "}}" }} {{ "{{" }}.Name{{ "}}" }}'
  register: docker_volumes_raw
  changed_when: false

#- name: Show extracted Rclone volumes (optional)
  #ansible.builtin.debug:
    #var: docker_volumes_raw

- name: Convert volume list to array
  ansible.builtin.set_fact:
    docker_volumes: "{{ docker_volumes_raw.stdout_lines }}"

- name: Extract only Rclone volumes
  ansible.builtin.set_fact:
    rclone_volumes: "{{ docker_volumes | select('search', '^rclone:') | map('split', ' ') | map('last') | list }}"

- name: Show extracted Rclone volumes (optional)
  ansible.builtin.debug:
    var: rclone_volumes

- name: Get all running Docker containers using CLI
  ansible.builtin.command:
    cmd: docker ps --format '{{ "{{" }}.Names{{ "}}" }} {{ "{{" }}.Labels{{ "}}" }}'
  register: docker_containers_raw
  changed_when: false

#- name: Show extracted containers (optional)
  #ansible.builtin.debug:
    #var: docker_containers_raw

- name: Convert container list to array
  ansible.builtin.set_fact:
    docker_containers_array: "{{ docker_containers_raw.stdout_lines }}"

- name: Extract Container names for docker by label
  ansible.builtin.set_fact:
    docker_docker_containers: "{{ docker_containers_array | reject('search', 'compose') | map('split', ' ') | map('first') | list }}"

- name: Extract Container names for docker-compose by label
  ansible.builtin.set_fact:
    docker_compose_containers: "{{ docker_containers_array | select('search', 'compose') | map('split', ' ') | map('first') | map('split', '-') | map('first') | unique | list }}"

#- name: Get all running Docker containers using CLI by names
  #ansible.builtin.command:
    #cmd: docker ps --format "table '{{ "{{" }}.Names{{ "}}" }}'"
  #register: docker_containers_raw
  #changed_when: false
