---
# PKGS
- name: Install requirements
  apt:
    name: "{{ item }}"
    state: latest
    update_cache: yes
  with_items:
    - rclone
    - fuse3
    - unzip
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'

- name: Install requirements
  yum:
    name: "{{ item }}"
    state: latest
  with_items:
    - rclone
    - fuse
    - unzip
  when: ansible_distribution == 'CentOS' or ansible_distribution == 'Red Hat Enterprise Linux' or ansible_distribution == 'Fedora'

- name: Install latest rclone version
  ansible.builtin.shell: |
    curl https://rclone.org/install.sh | bash
  ignore_errors: True


# CFG
- name: Create /mnt/storage directory
  ansible.builtin.file:
    path: /mnt/storage
    state: directory
    mode: '0755'
    #recurse: true

- name: Create /mnt/DATA directory
  ansible.builtin.file:
    path: /mnt/DATA
    state: directory
    mode: '0755'
    #recurse: true

- name: Create /mnt/MEDIA directory
  ansible.builtin.file:
    path: /mnt/MEDIA
    state: directory
    mode: '0755'
    #recurse: true

- name: Create cache directory
  ansible.builtin.file:
    path: /var/cache/rclone
    owner: root
    group: root
    state: directory
    recurse: yes

- name: Copy rclone config
  ansible.builtin.copy:
    src: ../files/rclone.conf
    dest: /etc/rclone.conf
    owner: root
    group: root
    mode: '0644'

- name: Create a symbolic link for mount.rclone
  ansible.builtin.file:
    src: /usr/bin/rclone
    dest: /usr/sbin/mount.rclone
    owner: root
    group: root
    state: link

- name: Create a symbolic link for fuser
  ansible.builtin.file:
    src: /usr/bin/fusermount
    dest: /usr/bin/fusermount3
    owner: root
    group: root
    state: link
  when: ansible_distribution == 'CentOS' or ansible_distribution == 'Red Hat Enterprise Linux' or ansible_distribution == 'Fedora' and ansible_distribution_major_version <= '40'
  ignore_errors: True



