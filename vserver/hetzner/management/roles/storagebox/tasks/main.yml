- name: Mount storage
  ansible.posix.mount:
    src: 'storagebox:'
    path: /mnt/storage
    #opts: rw,noauto,nofail,_netdev,x-systemd.automount,args2env,vfs_cache_mode=writes,config=/etc/rclone.conf,cache_dir=/var/cache/rclone
    opts: rw,nofail,_netdev,args2env,vfs_cache_mode=minimal,vfs_cache_max_age=5m,config=/etc/rclone.conf,cache_dir=/var/cache/rclone
    boot: true
    state: mounted
    fstype: rclone

- name: Mount storage DATA
  tags:
    - data
  ansible.posix.mount:
    src: 'data:'
    path: /mnt/DATA
    #opts: rw,noauto,nofail,_netdev,x-systemd.automount,args2env,vfs_cache_mode=writes,config=/etc/rclone.conf,cache_dir=/var/cache/rclone
    opts: rw,nofail,_netdev,args2env,vfs_cache_mode=minimal,vfs_cache_max_size=15G,vfs_cache_max_age=5m,config=/etc/rclone.conf,cache_dir=/var/cache/rclone
    boot: true
    state: mounted
    fstype: rclone

- name: Mount storage MEDIA
  tags:
    - media
  ansible.posix.mount:
    src: 'media:'
    path: /mnt/MEDIA
    #opts: rw,noauto,nofail,_netdev,x-systemd.automount,args2env,vfs_cache_mode=writes,config=/etc/rclone.conf,cache_dir=/var/cache/rclone
    opts: rw,nofail,_netdev,args2env,vfs_cache_mode=minimal,vfs_cache_max_size=15G,vfs_cache_max_age=5m,config=/etc/rclone.conf,cache_dir=/var/cache/rclone
    boot: true
    state: mounted
    fstype: rclone

- name: Reload systemd manager configuration
  command: systemctl daemon-reload
