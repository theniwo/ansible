- name: Apply changes ({{ ansible_distribution }} {{ ansible_distribution_version }})
  ansible.builtin.service:
    name: "{{ sshd_name }}"
    state: restarted
  vars:
    sshd_name: "{{ 'sshd' if ansible_facts['os_family'] == 'RedHat' else 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
  when: ansible_facts['os_family'] in ['RedHat', 'Debian']
