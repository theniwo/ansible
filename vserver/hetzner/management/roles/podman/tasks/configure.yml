- name: Copy dockerrc
  tags:
    - scripts
  ansible.builtin.template:
    src: dockerrc.j2
    dest: "/home/{{ item }}/.dockerrc"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0755'
  loop: "{{ users_above_1000 }}"
  become: true

- name: Insert source command to .bashrc
  tags:
    - scripts
  ansible.builtin.blockinfile:
    path: "/home/{{ item }}/.bashrc"
    block: |
      if [ -f $HOME/.dockerrc ]; then
        . $HOME/.dockerrc
      fi
  loop: "{{ users_above_1000 }}"
  become: true
