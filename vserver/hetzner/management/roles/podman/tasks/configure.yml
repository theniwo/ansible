- name: Copy healthcheck_{{ ansible_role_name }}
  tags:
    - scripts
  ansible.builtin.copy:
    src: "healthcheck_{{ ansible_role_name }}"
    dest: "{{ bin_path }}/healthcheck_{{ ansible_role_name }}"
    owner: root
    group: root
    mode: '0755'

- name: Create Cronjob
  tags:
    - cron
  ansible.builtin.cron:
    name: "healthcheck_{{ ansible_role_name }}"
    minute: "*/30"
    hour: "8-21"
    job: "{{ bin_path }}/healthcheck_{{ ansible_role_name }} >/dev/null"
    user: root

- name: Copy cont command
  tags:
    - scripts
  ansible.builtin.copy:
    src: cont
    dest: "{{ bin_path }}/cont"
    owner: root
    group: root
    mode: '0755'

- name: Copy comp command
  tags:
    - scripts
  ansible.builtin.copy:
    src: comp
    dest: "{{ bin_path }}/comp"
    owner: root
    group: root
    mode: '0755'

