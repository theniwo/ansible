---
- name: Supress emulation notification
  ansible.builtin.file:
    path: /etc/containers/nodocker
    state: touch

- name: Get users with UID > 1000
  ansible.builtin.shell: "awk -F: '$3 >= 1000 {print $1}' /etc/passwd | grep -v nobody"
  register: user_list

- name: Store users in a variable
  set_fact:
    users_above_1000: "{{ user_list.stdout_lines }}"

- name: Debug output
  debug:
    var: users_above_1000

- name: Enable linger for each user
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ item }}"
  loop: "{{ users_above_1000}}"
  become: true
  changed_when: false
  ignore_errors: true

  # without loop
#- name: Enable linger for user ID 1000
  #ansible.builtin.command:
    #cmd: loginctl enable-linger 1000
  #become: true
  #changed_when: false
  #ignore_errors: true

- name: Create directories for {{ ansible_role_name }} files
  tags:
    - scripts
  ansible.builtin.file:
    path: "/home/{{ item }}{{ docker_docker_dir }}"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0775'
    recurse: yes
  loop: "{{ users_above_1000 }}"
  become: true
  #become_user: "{{ users_above_1000 }}"

- name: Create directories for {{ ansible_role_name }}-compose files
  tags:
    - scripts
  ansible.builtin.file:
    path: "/home/{{ item }}/{{ docker_compose_dir }}"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0775'
    recurse: yes
  loop: "{{ users_above_1000 }}"
  become: true
  #become_user: "{{ users_above_1000 }}"

