---
- name: Remove old docker installations ({{ ansible_distribution }} {{ ansible_distribution_version }})
  ansible.builtin.package:
    name: "{{ item }}"
    state: absent
  loop:
    - docker.io
    - docker-ce-cli
    - docker-doc
    - docker-compose
    - docker-compose-v2
    - podman-docker
    - containerd
    - runc
  ignore_errors: true
  when: ansible_facts['os_family'] in ['Debian']

- name: Remove old docker installations ({{ ansible_distribution }} {{ ansible_distribution_version }})
  ansible.builtin.package:
    name: "{{ item }}"
    state: absent
  loop:
    - docker
    - docker-ce-cli
    - docker-client
    - docker-client-latest
    - docker-common
    - docker-latest
    - docker-latest-logrotate
    - docker-logrotate
    - docker-selinux
    - docker-engine-selinux
    - docker-engine
  ignore_errors: true
  when: ansible_facts['os_family'] in ['RedHat']

- name: Install requirements ({{ ansible_distribution }} {{ ansible_distribution_version }})
  ansible.builtin.package:
    name:
      - podman
      - podman-docker
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] in ['Debian', 'RedHat']

- name: Install podman-compose on {{ ansible_distribution }} {{ ansible_distribution_version }} or later
  ansible.builtin.package:
    name: podman-compose
    state: present
    update_cache: yes
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - ansible_facts['distribution_major_version'] is version('24', '>=')

- name: Install podman-compose ({{ ansible_distribution }} {{ ansible_distribution_version }})
  ansible.builtin.package:
    name: podman-compose
    state: present
  when: ansible_facts['os_family'] in ['RedHat']

- name: Supress emulation notification
  ansible.builtin.file:
    path: /etc/containers/nodocker
    state: touch

  # scan for all uids >=1000
- name: Enable linger for user ID 1000
  ansible.builtin.command:
    cmd: loginctl enable-linger 1000
  become: true
  changed_when: false
  ignore_errors: true

- name: Run hello-world container
  containers.podman.podman_container:
    name: hello-world-container
    image: hello-world
    state: started
    remove: false
  register: hello_world_result

- name: Print hello-world container logs
  command: podman logs hello-world-container
  register: hello_world_logs
  ignore_errors: true

- name: Display container logs
  debug:
    msg: "{{ hello_world_logs.stdout_lines }}"

- name: Remove hello-world container
  containers.podman.podman_container:
    name: hello-world-container
    state: absent
    force_delete: true

- name: Remove hello-world image
  containers.podman.podman_image:
    name: hello-world
    state: absent
    force: true

