- name: Create /var/lib/docker-plugins/rclone/config
  tags:
    - rclone
  ansible.builtin.file:
    path: /var/lib/docker-plugins/rclone/config
    state: directory
    mode: '0755'
    recurse: true

- name: Create /var/lib/docker-plugins/rclone/cache
  tags:
    - rclone
  ansible.builtin.file:
    path: /var/lib/docker-plugins/rclone/cache
    state: directory
    mode: '0755'
    recurse: true

- name: Install latest rclone docker plugin
  tags:
    - rclone
  community.docker.docker_plugin:
    plugin_name: rclone/docker-volume-rclone
    state: enable
  ignore_errors: true

# The manual way
#- name: Install latest rclone docker plugin
  #tags:
    #- rclone
  #ansible.builtin.shell: |
    #docker plugin install rclone/docker-volume-rclone:{{ ansible_architecture | regex_replace('x86_64', 'amd64') }} args="-v" --alias rclone --grant-all-permissions
  #ignore_errors: True

- name: Create a symbolic link for docker-plugin rclone
  tags:
    - rclone
  ansible.builtin.file:
    src: /etc/rclone.conf
    dest: /var/lib/docker-plugins/rclone/config/rclone.conf
    owner: root
    group: root
    state: hard
  ignore_errors: true

- name: Create directories for docker files
  tags:
    - scripts
  ansible.builtin.file:
    path: $HOME/docker/docker
    state: directory
    owner: root
    group: root
    mode: 0775
    recurse: yes

- name: Create directories for docker-compose files
  tags:
    - scripts
  ansible.builtin.file:
    path: $HOME/docker/docker-compose
    state: directory
    owner: root
    group: root
    mode: 0775
    recurse: yes

- name: Copy healthcheck_docker
  tags:
    - scripts
  ansible.builtin.copy:
    src: ../files/healthcheck_docker
    dest: "{{ bin_path }}/healthcheck_docker"
    owner: root
    group: root
    mode: '0755'

- name: Create Cronjob
  tags:
    - cron
  ansible.builtin.cron:
    name: "healthcheck_docker"
    minute: "*/30"
    hour: "8-21"
    job: "{{ bin_path }}/healthcheck_docker >/dev/null"

- name: Copy cont command
  tags:
    - scripts
  ansible.builtin.copy:
    src: ../files/cont
    dest: "{{ bin_path }}/cont"
    owner: root
    group: root
    mode: '0755'

- name: Copy comp command
  tags:
    - scripts
  ansible.builtin.copy:
    src: ../files/comp
    dest: "{{ bin_path }}/comp"
    owner: root
    group: root
    mode: '0755'

- name: Copy dockerrc
  tags:
    - scripts
  ansible.builtin.copy:
    src: ../files/dockerrc
    dest: $HOME/.dockerrc
    owner: root
    group: root
    mode: '0755'

- name: Insert source command to .bashrc
  tags:
    - scripts
  ansible.builtin.blockinfile:
    path: $HOME/.bashrc
    block: |
      if [ -f $HOME/.dockerrc ]; then
        . $HOME/.dockerrc
      fi
