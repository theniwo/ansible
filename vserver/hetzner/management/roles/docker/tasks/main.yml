- name: Create /var/lib/docker-plugins/rclone/config
  ansible.builtin.file:
    path: /var/lib/docker-plugins/rclone/config
    state: directory
    mode: '0755'
    recurse: true

- name: Create /var/lib/docker-plugins/rclone/cache
  ansible.builtin.file:
    path: /var/lib/docker-plugins/rclone/cache
    state: directory
    mode: '0755'
    recurse: true

- name: Install latest rclone docker pluging
  ansible.builtin.shell: |
    docker plugin install rclone/docker-volume-rclone:amd64 args="-v" --alias rclone --grant-all-permissions
  ignore_errors: True

- name: Create a symbolic link for docker-plugin rclone
  ansible.builtin.file:
    src: /etc/rclone.conf
    dest: /var/lib/docker-plugins/rclone/config/rclone.conf
    owner: root
    group: root
    state: hard

- name: Create directories for docker files
  ansible.builtin.file:
    path: /root/docker/docker
    state: directory
    owner: root
    group: root
    mode: 0775
    recurse: yes

- name: Create directories for docker-compose files
  ansible.builtin.file:
    path: /root/docker/docker-compose
    state: directory
    owner: root
    group: root
    mode: 0775
    recurse: yes

- name: copy healthcheck_docker
  ansible.builtin.copy:
    src: ../files/healthcheck_docker
    dest: /usr/local/bin/healthcheck_docker
    owner: root
    group: root
    mode: '0755'

- name: Create Cronjob
  ansible.builtin.cron:
    name: "healthcheck_docker"
    minute: "*/30"
    hour: "8-21"
    job: "/usr/local/bin/healthcheck_docker >/dev/null"

- name: copy cont command
  ansible.builtin.copy:
    src: ../files/cont
    dest: /usr/local/bin/cont
    owner: root
    group: root
    mode: '0755'

- name: copy comp command
  ansible.builtin.copy:
    src: ../files/comp
    dest: /usr/local/bin/comp
    owner: root
    group: root
    mode: '0755'

- name: copy dockerrc
  ansible.builtin.copy:
    src: ../files/dockerrc
    dest: $HOME/.dockerrc
    owner: root
    group: root
    mode: '0755'

- name: Insert source command to .bashrc
  ansible.builtin.blockinfile:
    path: $HOME/.bashrc
    block: |
      if [ -f $HOME/.dockerrc ]; then
        . $HOME/.dockerrc
      fi
