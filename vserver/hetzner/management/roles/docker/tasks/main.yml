- when: ansible_facts['os_family'] in ['RedHat']
  block:
    - name: Remove old docker installations ({{ ansible_distribution }} {{ ansible_distribution_version }})
      ansible.builtin.package:
        name: "{{ item }}"
        state: absent
      with_items:
        - docker
        - docker-client
        - docker-client-latest
        - docker-common
        - docker-latest
        - docker-latest-logrotate
        - docker-logrotate
        - docker-selinux
        - docker-engine-selinux
        - docker-engine
      ignore_errors: true

    - name: Install docker repository ({{ ansible_distribution }} {{ ansible_distribution_version }})
      yum_repository:
        name: docker-ce
        description: Docker CE Stable - $basearch
        baseurl: https://download.docker.com/linux/{{ ansible_distribution | lower }}/$releasever/$basearch/stable
        enabled: yes
        gpgcheck: yes
        gpgkey: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg

