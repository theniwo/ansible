- name: Add Docker's official GPG key
  ansible.builtin.shell: install -m 0755 -d /etc/apt/keyrings && curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc && chmod a+r /etc/apt/keyrings/docker.asc
  when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'

