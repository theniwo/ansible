---
- when: ansible_facts['os_family'] in ['Debian']
  block:
    - name: Remove old docker installations ({{ ansible_distribution }} {{ ansible_distribution_version }})
      ansible.builtin.package:
        name: "{{ item }}"
        state: absent
      with_items:
        - docker.io
        - docker-doc
        - docker-compose
        - docker-compose-v2
        - podman-docker
        - containerd
        - runc
      ignore_errors: true

    - name: Install requirements ({{ ansible_distribution }} {{ ansible_distribution_version }})
      apt:
        name: "{{ item }}"
        state: latest
        update_cache: yes
      with_items:
        - ca-certificates
        - curl

    - name: Add the Docker repository ({{ ansible_distribution }} {{ ansible_distribution_version }})
      block:
        - name: Ensure apt keyring directory exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'
            recurse: true
        - name: Add Docker's official GPG key ({{ ansible_distribution }} {{ ansible_distribution_version }})
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
            dest: /etc/apt/keyrings/docker.asc
        - name: Add the repository to Apt sources ({{ ansible_distribution }} {{ ansible_distribution_version }})
          ansible.builtin.apt_repository:
            repo: deb [arch={{ ansible_architecture | regex_replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/{{ ansible_system | lower }}/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
            filename: docker

    - name: Install docker-ce ({{ ansible_distribution }} {{ ansible_distribution_version }})
      apt:
        name: "{{ item }}"
        state: latest
        update_cache: true
      with_items:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin


    # The manual way
