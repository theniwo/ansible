---
- name: Deploy Valheim Server
  hosts: valheim
  become: true

  vars_files:
    - group_vars/vault.yml

  tasks:

    - name: Check if Docker is installed
      ansible.builtin.command:
        cmd: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Install Docker if missing
      ansible.builtin.package:
        name:
          - docker.io
        state: present
      when: docker_check.rc != 0

    - name: Ensure Docker service is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Check if Docker Compose v2 is available
      ansible.builtin.command:
        cmd: docker compose version
      register: compose_check
      changed_when: false
      failed_when: false

    - name: Fail if Docker Compose v2 is missing
      ansible.builtin.fail:
        msg: >
          Docker is installed, but Docker Compose v2 is not available.
          Please install the Docker Compose plugin on this host.
      when: compose_check.rc != 0

    - name: Create persistent Valheim config volume
      community.docker.docker_volume:
        name: "{{ valheim_config_volume_name }}"
        state: present

    - name: Create Valheim base directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ valheim_base_dir }}"
        - "{{ valheim_data_dir }}"

    - name: Check for legacy Valheim config directory
      ansible.builtin.stat:
        path: "{{ valheim_legacy_config_dir }}"
      register: valheim_legacy_config
      when: valheim_legacy_config_dir != valheim_config_dir

    - name: Inspect legacy Valheim config directory
      ansible.builtin.find:
        paths: "{{ valheim_legacy_config_dir }}"
        file_type: any
        hidden: true
        recurse: false
      register: valheim_legacy_config_files
      when:
        - valheim_legacy_config_dir != valheim_config_dir
        - valheim_legacy_config.stat.isdir | default(false)

    - name: Inspect persistent Valheim config volume
      ansible.builtin.find:
        paths: "{{ valheim_config_dir }}"
        file_type: any
        hidden: true
        recurse: false
      register: valheim_volume_config_files

    - name: Migrate existing config into the persistent Docker volume
      ansible.builtin.command:
        argv:
          - cp
          - --archive
          - "{{ valheim_legacy_config_dir }}/."
          - "{{ valheim_config_dir }}/"
      when:
        - valheim_legacy_config_dir != valheim_config_dir
        - valheim_legacy_config_files.matched | default(0) | int > 0
        - valheim_volume_config_files.matched | int == 0

    - name: Create Valheim config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ valheim_config_dir }}"
        - "{{ valheim_worlds_dir }}"
        - "{{ valheim_bepinex_plugins_dir }}"

    - name: Check for legacy standalone worlds volume
      ansible.builtin.stat:
        path: "{{ valheim_legacy_worlds_volume_dir }}"
      register: valheim_legacy_worlds_volume

    - name: Inspect legacy standalone worlds volume
      ansible.builtin.find:
        paths: "{{ valheim_legacy_worlds_volume_dir }}"
        file_type: any
        hidden: true
        recurse: false
      register: valheim_legacy_volume_world_files
      when: valheim_legacy_worlds_volume.stat.isdir | default(false)

    - name: Inspect worlds directory in config volume
      ansible.builtin.find:
        paths: "{{ valheim_worlds_dir }}"
        file_type: any
        hidden: true
        recurse: false
      register: valheim_config_world_files

    - name: Migrate legacy standalone worlds volume into config volume
      ansible.builtin.command:
        argv:
          - cp
          - --archive
          - "{{ valheim_legacy_worlds_volume_dir }}/."
          - "{{ valheim_worlds_dir }}/"
      when:
        - valheim_legacy_volume_world_files.matched | default(0) | int > 0
        - valheim_config_world_files.matched | int == 0

    - name: Deploy Valheim world creation helper
      ansible.builtin.copy:
        src: files/valheim_mkworld.py
        dest: /usr/local/bin/valheim-mkworld
        owner: root
        group: root
        mode: "0755"

    - name: Validate custom Valheim world seed
      ansible.builtin.assert:
        that:
          - valheim_world_seed is string
          - valheim_world_seed is match('^[A-Za-z0-9]{1,10}$')
        fail_msg: >-
          valheim_world_seed must contain 1 to 10 ASCII letters or digits.
          Leave it empty or null to let Valheim generate the world.
      when:
        - valheim_world_seed is not none
        - valheim_world_seed | string | length > 0

    - name: Check whether the Valheim world already exists
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ valheim_worlds_dir }}/{{ valheim_world_name }}"
        - "{{ valheim_worlds_dir }}/{{ valheim_world_name }}.fwl"
        - "{{ valheim_worlds_dir }}/{{ valheim_world_name }}.db"
      register: valheim_world_files
      when:
        - valheim_world_seed is not none
        - valheim_world_seed | string | length > 0

    - name: Create initial Valheim world metadata with custom seed
      ansible.builtin.command:
        argv:
          - /usr/local/bin/valheim-mkworld
          - "{{ valheim_world_name }}"
          - "{{ valheim_world_seed }}"
          - "{{ valheim_worlds_dir }}/{{ valheim_world_name }}.fwl"
      when:
        - valheim_world_seed is not none
        - valheim_world_seed | string | length > 0
        - not (valheim_world_files.results | selectattr('stat.exists') | list | length)

    - name: Deploy Valheim mod synchronisation script
      ansible.builtin.copy:
        src: files/valheim_mod_sync.py
        dest: "{{ valheim_base_dir }}/valheim_mod_sync.py"
        owner: root
        group: root
        mode: "0755"

    - name: Deploy pinned Valheim mod manifest
      ansible.builtin.template:
        src: templates/mods.json.j2
        dest: "{{ valheim_mod_manifest_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Deploy Docker Compose configuration
      ansible.builtin.template:
        src: templates/compose.yml.j2
        dest: "{{ valheim_base_dir }}/compose.yml"
        owner: root
        group: root
        mode: "0644"
      register: compose_config

    - name: Deploy Valheim environment
      ansible.builtin.template:
        src: templates/valheim.env.j2
        dest: "{{ valheim_base_dir }}/valheim.env"
        owner: root
        group: root
        mode: "0600"
      register: valheim_environment
      no_log: true

    - name: Deploy Valheim container
      community.docker.docker_compose_v2:
        project_src: "{{ valheim_base_dir }}"
        files:
          - compose.yml
        state: present
        pull: missing

    - name: Synchronise pinned Thunderstore mods
      ansible.builtin.command:
        argv:
          - "{{ valheim_base_dir }}/valheim_mod_sync.py"
          - "--manifest"
          - "{{ valheim_mod_manifest_path }}"
          - "--plugins-dir"
          - "{{ valheim_bepinex_plugins_dir }}"
      register: valheim_mod_sync
      # Do not try to parse stdout when the synchroniser failed. This keeps its
      # actionable stderr (for example, the unsupported patchers/ message)
      # visible instead of replacing it with a Jinja JSON parsing error.
      changed_when: >-
        valheim_mod_sync.rc == 0 and
        (valheim_mod_sync.stdout | from_json).changed
      notify: Restart Valheim container

  handlers:
    - name: Restart Valheim container
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ valheim_base_dir }}"
          - restart
          - app
      changed_when: true
