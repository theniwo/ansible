---
valheim_server_name: "Nils Valheim Server"
valheim_world_name: "Midgard"

# Optional custom seed.
# Leave empty/null to let Valheim generate the world normally.
valheim_world_seed: "Vaaltorin"

valheim_server_public: true
valheim_crossplay: false

valheim_port: 2456

valheim_base_dir: /opt/valheim
valheim_data_dir: "{{ valheim_base_dir }}/data"
valheim_config_volume_name: valheim-config
valheim_config_dir: "/var/lib/docker/volumes/{{ valheim_config_volume_name }}/_data"
valheim_legacy_config_dir: "{{ valheim_base_dir }}/config"
valheim_legacy_worlds_volume_dir: /var/lib/docker/volumes/valheim-worlds/_data
valheim_worlds_dir: "{{ valheim_config_dir }}/worlds_local"

valheim_bepinex_plugins_dir: "{{ valheim_config_dir }}/bepinex/plugins"
valheim_mod_manifest_path: "{{ valheim_base_dir }}/mods.json"

# Thunderstore-Mods werden immer auf eine konkrete Version gepinnt. Abhaengigkeiten
# werden vom Synchronisationsskript rekursiv in genau der von Thunderstore
# angegebenen Version aufgeloest.
valheim_mods: []
#  - namespace: Azumatt
#    name: AzuCraftyBoxes
#    version: 1.6.2

# SteamID64, falls gewünscht
valheim_admin_ids:
  - "76561198000000000"
