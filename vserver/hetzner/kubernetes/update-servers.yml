---
- name: Ubuntu Server patchen und neu starten
  hosts: kubernetes_nodes
  become: true
  gather_facts: true

  tasks:
    - name: Paketquellen aktualisieren (apt-get update)
      ansible.builtin.apt:
        update_cache: yes
        force_apt_get: yes

    - name: Alle Pakete auf den neuesten Stand bringen (apt-get upgrade)
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: yes

    - name: Prüfen, ob ein Neustart erforderlich ist
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Server neu starten, falls erforderlich
      ansible.builtin.reboot:
        msg: "Server wird nach Ansible-Updates neu gestartet"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: reboot_required_file.stat.exists
