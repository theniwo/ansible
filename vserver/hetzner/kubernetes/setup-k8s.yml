---
- name: Vorbereitung und Installation aller Kubernetes Nodes
  hosts: kubernetes_nodes
  become: true
  pre_tasks:
    - name: "Load variables"
      ansible.builtin.include_vars:
        file: k8s.yml
  tasks:
    - name: Paketquellen aktualisieren
      apt:
        update_cache: yes

    - name: Erforderliche Systempakete installieren (inkl. conntrack)
      apt:
        name:
          - curl
          - gnupg2
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - conntrack
        state: present

    - name: Ubuntu Firewall (UFW) dauerhaft deaktivieren und stoppen
      ufw:
        state: disabled

    - name: Swap vorübergehend deaktivieren
      command: swapoff -a
      changed_when: false

    - name: Swap dauerhaft in /etc/fstab auskommentieren
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'

    - name: Kernel-Module für Kubernetes laden
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Module sofort aktivieren
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Sysctl-Parameter für Kubernetes Netzwerk setzen
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: yes
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    - name: Containerd installieren
      apt:
        name: containerd
        state: present

    - name: Containerd Konfigurationsverzeichnis erstellen
      file:
        path: /etc/containerd
        state: directory

    - name: Containerd Standard-Konfiguration generieren
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: SystemdCgroup in containerd aktivieren
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: Verzeichnis für APT-Keyrings erstellen
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Verzeichnis für APT-Keyrings sicherstellen
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Kubernetes GPG-Schlüssel herunterladen (de-armored)
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Kubernetes Repository via Datei hinzufügen
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /\n"
        mode: '0644'

    - name: Kubernetes-Komponenten installieren
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Automatische Updates für K8s-Pakete sperren (apt-mark hold)
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

  handlers:
    - name: Restart containerd
      service:
        name: containerd
        state: restarted

- name: Initialisierung der Control-Plane (Master Node)
  hosts: kube_master
  become: true
  tasks:
    - name: Prüfen, ob der Cluster bereits initialisiert ist
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_init_done

    - name: Kubernetes Cluster initialisieren
      command: kubeadm init --pod-network-cidr=10.244.0.0/16
      when: not kubeadm_init_done.stat.exists
      register: kubeadm_output

    - name: .kube Verzeichnis für den Root-Benutzer erstellen
      file:
        path: /root/.kube
        state: directory
        mode: '0755'

    - name: Kubeconfig für Root kopieren
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        mode: '0600'

    - name: Bash-Completion Paket installieren
      apt:
        name: bash-completion
        state: present

    - name: Kubernetes Aliases und Completion in .bash_aliases einfügen
      blockinfile:
        path: /root/.bash_aliases
        create: yes
        mode: '0644'
        block: |
          source /etc/profile.d/bash_completion.sh
          source <(kubectl completion bash)
          alias k=kubectl
          complete -F __start_kubectl k
        marker: "# {mark} ANSIBLE MANAGED KUBERNETES ALIASES"

    - name: Flannel Manifest herunterladen
      get_url:
        url: https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
        dest: /tmp/kube-flannel.yml

    - name: Flannel an das private 10er-Netzwerk binden
      replace:
        path: /tmp/kube-flannel.yml
        regexp: '- --kube-subnet-mgr'
        replace: |
          - --kube-subnet-mgr
                  - --iface-regex=10\.0\..*

    - name: Modifiziertes Flannel Pod-Netzwerk installieren
      command: kubectl apply -f /tmp/kube-flannel.yml
      environment:
        KUBECONFIG: /root/.kube/config
      when: not kubeadm_init_done.stat.exists

    - name: Join-Befehl für Worker-Nodes generieren
      command: kubeadm token create --print-join-command
      register: join_command_output
      changed_when: false

    - name: Join-Befehl zwischenspeichern
      set_fact:
        join_command: "{{ join_command_output.stdout }}"

- name: Kubelets an das private Hetzner-Interface binden
  hosts: kubernetes_nodes
  become: true

  tasks:
    - name: Die private IP des enp7s0 Interfaces auslesen
      ansible.builtin.set_fact:
        k8s_private_ip: "{{ ansible_facts['enp7s0']['ipv4']['address'] }}"

    - name: Kubelet Konfigurationsdatei prüfen oder erstellen
      ansible.builtin.lineinfile:
        path: /etc/default/kubelet
        line: 'KUBELET_EXTRA_ARGS="--node-ip={{ k8s_private_ip }}"'
        regexp: '^KUBELET_EXTRA_ARGS='
        create: yes
        owner: root
        group: root
        mode: '0644'

    - name: Kubelet Dienst neu laden und restarten
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        daemon_reload: yes

- name: Worker-Nodes dem Cluster hinzufügen
  hosts: kube_workers
  become: true
  tasks:
    - name: Prüfen, ob Worker bereits im Cluster ist
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_joined

    - name: Worker-Node dem Cluster hinzufügen
      command: "{{ hostvars[groups['kube_master'][0]]['join_command'] }}"
      when: not kubelet_joined.stat.exists

- name: Deployment YAMLs aus Git holen und bereitstellen
  hosts: kube_master
  vars:
    temp_git_dir: "/tmp/git_temp_deployments"

  tasks:
    - name: Zielordner auf dem Server sicherstellen
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ dest_dir }}"
        - "{{ temp_git_dir }}"

    - name: Repository flach (depth=1) in Temp-Ordner klonen
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ temp_git_dir }}"
        version: "{{ git_branch }}"
        depth: 1
        # Falls du SSH-Keys nutzt, kannst du hier die Key-Datei angeben:
        #key_file: "/home/ansible/.ssh/id_rsa"

    - name: Nur die YAML-Dateien aus dem Git-Ordner in das Zielverzeichnis kopieren
      ansible.builtin.copy:
        src: "{{ temp_git_dir }}/{{ repo_dir }}/"
        dest: "{{ dest_dir }}/"
        remote_src: yes # Sagt Ansible, dass die Quelle bereits auf dem Zielserver liegt
        mode: '0644'

    - name: Temporäres Git-Verzeichnis wieder löschen
      ansible.builtin.file:
        path: "{{ temp_git_dir }}"
        state: absent
