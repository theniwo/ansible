---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80        # Der Port, auf dem der Service intern im Cluster erreichbar ist
      targetPort: 80  # Der Port des NGINX-Containers
      nodePort: 30080 # Der Port, über den NGINX von JEDER Server-IP nach außen erreichbar ist

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-data-volume
          mountPath: "/var/www/html"
      volumes:
      - name: nginx-data-volume
        persistentVolumeClaim:
          claimName: nginx-data-pvc # Verknüpfung mit dem PVC von oben

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany # Erlaubt gleichzeitigen Zugriff von mehreren Nodes/Pods
  storageClassName: longhorn # Sagt K8s, dass Longhorn den Speicher bereitstellen soll
  resources:
    requests:
      storage: 1Gi # Die gewünschte Größe (kannst du anpassen)
