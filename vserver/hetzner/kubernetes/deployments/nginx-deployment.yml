---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80        # Der Port, auf dem der Service intern im Cluster erreichbar ist
      targetPort: 80  # Der Port des NGINX-Containers
      nodePort: 30080 # Der Port, über den NGINX von JEDER Server-IP nach außen erreichbar ist

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config-volume
          mountPath: "/etc/nginx"
        - name: nginx-data-volume
          mountPath: "/var/www/html"
        - name: nginx-log-volume
          mountPath: "/var/log/nginx"
      volumes:
      - name: nginx-config-volume
        persistentVolumeClaim:
          claimName: nginx-config-pvc 
      - name: nginx-data-volume
        persistentVolumeClaim:
          claimName: nginx-data-pvc 
      - name: nginx-log-volume
        persistentVolumeClaim:
          claimName: nginx-log-pvc 


---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-config-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany 
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Mi 

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany 
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi 

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-log-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany 
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi 
