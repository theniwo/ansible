---
- name: Install Helm on Kubernetes Nodes
  hosts: kube_master
  become: true
  pre_tasks:
    - name: "Load variables"
      ansible.builtin.include_vars:
        file: k8s.yml

  tasks:
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Create keyring directory
      file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Download Helm GPG signing key
      apt_key:
        url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
        state: present
        keyring: /usr/share/keyrings/helm.gpg

    - name: Add Helm APT repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
        state: present
        filename: helm-stable-debian

    - name: Install Helm
      apt:
        name: helm
        state: present
        update_cache: yes

    - name: Verify Helm installation
      command: helm version
      register: helm_version_output
      changed_when: false

    - name: Show Helm version
      debug:
        msg: "Installed {{ helm_version_output.stdout }}"

- name: Helm Chart YAMLs aus Git holen und bereitstellen
  hosts: kube_master
  vars:
    git_repo: "{{ git_repo }}"
    git_branch: "master"
    ordner_im_repo: "vserver/hetzner/kubernetes/helmcharts"
    ziel_ordner: "/root/helmcharts"
    temp_git_dir: "/tmp/git_temp_helmcharts"

  tasks:
    - name: Zielordner auf dem Server sicherstellen
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ziel_ordner }}"
        - "{{ temp_git_dir }}"

    - name: Repository flach (depth=1) in Temp-Ordner klonen
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ temp_git_dir }}"
        version: "{{ git_branch }}"
        depth: 1
        # Falls du SSH-Keys nutzt, kannst du hier die Key-Datei angeben:
        #key_file: "/home/ansible/.ssh/id_rsa"

    - name: Nur die YAML-Dateien aus dem Git-Ordner in das Zielverzeichnis kopieren
      ansible.builtin.copy:
        src: "{{ temp_git_dir }}/{{ ordner_im_repo }}/"
        dest: "{{ ziel_ordner }}/"
        remote_src: yes # Sagt Ansible, dass die Quelle bereits auf dem Zielserver liegt
        mode: '0644'

    - name: Temporäres Git-Verzeichnis wieder löschen
      ansible.builtin.file:
        path: "{{ temp_git_dir }}"
        state: absent
